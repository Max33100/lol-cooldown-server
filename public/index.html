<script>
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${location.host}`);
    const trackerContainer = document.getElementById('tracker');

    // Mappatura di base degli oggetti popolari che danno Ability Haste
    // (L'API locale fornisce gli oggetti posseduti da ciascun giocatore)
    function calculateAbilityHaste(player) {
        let totalAH = 0;

        // 1. Calcolo Haste dagli Oggetti (se presenti nell'API)
        if (player.items && Array.isArray(player.items)) {
            player.items.forEach(item => {
                // Esempi di stats o ID item forniti dall'API locale
                if (item.abilityHaste) {
                    totalAH += item.abilityHaste;
                }
            });
        }

        // 2. Calcolo Haste dalle Rune
        if (player.runes) {
            // Stat Shards o rune come Transcendance (se presenti nel payload)
            if (player.runes.keystone && player.runes.keystone.id === 8210) {
                totalAH += 10;
            }
        }

        return totalAH;
    }

    ws.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);
            
            if (data.gameEnd) {
                trackerContainer.innerHTML = '<div style="color: #a09b8c;">Partita terminata.</div>';
                return;
            }

            const players = Array.isArray(data) ? data : (data.allPlayers || []);
            if (players.length === 0) return;

            trackerContainer.innerHTML = players.map(player => {
                const champName = player.championName || "Unknown";
                const level = player.level || 1;
                const team = player.team || "UNKNOWN";
                
                // Calcola l'Ability Haste stimata/rilevata
                const calculatedAH = calculateAbilityHaste(player);
                
                const iconUrl = `https://ddragon.leagueoflegends.com/cdn/14.1.1/img/champion/${champName}.png`;

                return `
                    <div class="card">
                        <img class="avatar" src="${iconUrl}" onerror="this.src='https://via.placeholder.com/48'" alt="${champName}">
                        <div class="info">
                            <div class="name">${champName} <span style="font-size: 11px; color: #785a28;">(Lvl ${level})</span></div>
                            <div class="stats">Team: ${team}</div>
                        </div>
                        <div class="ah-badge" title="Ability Haste">
                            AH: ${calculatedAH}
                        </div>
                    </div>
                `;
            }).join('');

        } catch (err) {
            console.error("Errore nel parsing dei dati WebSocket:", err);
        }
    };

    function toggleBackground() {
        document.body.style.backgroundColor = 
            document.body.style.backgroundColor === 'transparent' ? 'rgba(0, 0, 0, 0.7)' : 'transparent';
    }
</script>
