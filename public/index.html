<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>LoL Cooldown Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            margin: 0;
            padding: 10px;
        }
        #controls {
            margin-bottom: 10px;
        }
        button {
            background: #1e2328;
            color: #cdbe91;
            border: 1px solid #785a28;
            padding: 5px 10px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #2a323d;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .card {
            display: flex;
            align-items: center;
            background: rgba(20, 25, 30, 0.85);
            border: 1px solid #3c3c41;
            padding: 6px;
            border-radius: 4px;
            width: 320px;
        }
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            margin-right: 10px;
            border: 1px solid #785a28;
        }
        .info {
            flex-grow: 1;
        }
        .name {
            font-weight: bold;
            font-size: 14px;
            color: #f0e6d2;
        }
        .stats {
            font-size: 12px;
            color: #a09b8c;
        }
        .ah-badge {
            background: #091428;
            color: #005a82;
            border: 1px solid #005a82;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="controls">
        <button onclick="toggleBackground()">Sfondo Trasparente (OBS)</button>
    </div>

    <div id="tracker" class="container">
        <div style="color: #a09b8c;">In attesa di dati dalla partita...</div>
    </div>

    <script>
        // Stabilisce la connessione WebSocket automatica col server Render
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${location.host}`);

        const trackerContainer = document.getElementById('tracker');

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                
                if (data.gameEnd) {
                    trackerContainer.innerHTML = '<div style="color: #a09b8c;">Partita terminata. In attesa di una nuova partita...</div>';
                    return;
                }

                // data può essere direttamente l'array dei giocatori o l'oggetto risposto da Riot
                const players = Array.isArray(data) ? data : (data.allPlayers || []);

                if (players.length === 0) return;

                // Renderizza la lista dei giocatori
                trackerContainer.innerHTML = players.map(player => {
                    const champName = player.championName || "Unknown";
                    const level = player.level || 1;
                    const team = player.team || "UNKNOWN";
                    
                    // Recupero dell'icona da DataDragon
                    const iconUrl = `https://ddragon.leagueoflegends.com/cdn/14.1.1/img/champion/${champName}.png`;

                    return `
                        <div class="card">
                            <img class="avatar" src="${iconUrl}" onerror="this.src='https://via.placeholder.com/48'" alt="${champName}">
                            <div class="info">
                                <div class="name">${champName} <span style="font-size: 10px; color: #785a28;">(Lvl ${level})</span></div>
                                <div class="stats">Team: ${team}</div>
                            </div>
                            <div class="ah-badge">AH: --</div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Errore nel parsing dei dati WebSocket:", err);
            }
        };

        function toggleBackground() {
            if (document.body.style.backgroundColor === 'transparent') {
                document.body.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
            } else {
                document.body.style.backgroundColor = 'transparent';
            }
        }
    </script>
</body>
</html>
